<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Your Signup | Pose & Poise</title>
    <!-- We include Google Fonts so modern clients can render the brand typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
</head>
<!-- Fallback fonts are included in inline styles for broad compatibility -->
<body style="margin: 0; padding: 0; background-color: #faf9f7; font-family: 'Cormorant Garamond', Georgia, serif; color: #1a1a1a; -webkit-font-smoothing: antialiased;">
    <!-- Outer Table -->
    <table width="100%" bgcolor="#faf9f7" cellpadding="0" cellspacing="0" border="0" style="width: 100%; border-spacing: 0;">
        <tr>
            <td align="center" style="padding: 60px 20px;">
                
                <!-- Inner Container Table -->
                <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 500px; margin: 0 auto; background-color: #faf9f7;">
                    
                    <!-- Header -->
                    <tr>
                        <td align="center" style="padding-bottom: 40px; border-bottom: 1px solid rgba(26, 26, 26, 0.1);">
                            <table cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto; margin-bottom: 16px;">
                                <tr>
                                    <td align="center">
                                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" style="display: block; margin: 0 auto;">
                                            <circle cx="13" cy="3" r="1.2" fill="#1a1a1a" stroke="none" />
                                            <path d="M13 4.5c-1 0-2.5.5-3.5 2s-1 3-1 3" />
                                            <path d="M13 4.5c.8 3 0 7-2 9" />
                                            <path d="M11 13.5c-2 3-5 5-6 9.5h14c-1-5-4-7-6-9.5" />
                                            <path d="M11 15l1 7" opacity="0.3" stroke-width="0.8" />
                                            <path d="M11 7.5l3.5 1.5-1 4" />
                                        </svg>
                                    </td>
                                </tr>
                            </table>
                            <!-- Logo Logotype -->
                            <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 24px; font-weight: 600; color: #1a1a1a; letter-spacing: 4px; text-transform: uppercase;">Pose & Poise</div>
                        </td>
                    </tr>
                    
                    <!-- Main Content -->
                    <tr>
                        <td align="center" style="padding: 40px 0;">
                            <h2 style="font-size: 32px; font-weight: 400; margin-top: 0; margin-bottom: 24px; color: #1a1a1a; letter-spacing: 1px;">Confirm Your Signup</h2>
                            
                            <p style="font-family: 'Outfit', Arial, sans-serif; font-size: 16px; line-height: 1.6; color: rgba(26, 26, 26, 0.8); margin: 0 auto 40px auto; max-width: 400px; font-weight: 300;">
                                Thank you for joining Pose & Poise Studio. Please follow the link below to verify your email address and activate your account.
                            </p>
                            
                            <!-- Button Table (bulletproof button approach) -->
                            <table cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto 40px auto;">
                                <tr>
                                    <td align="center" style="background-color: #1a1a1a; transition: all 0.3s ease;">
                                        <a href= "{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
                                        style="background-color: #1a1a1a; color: #faf9f7; padding: 18px 48px; text-decoration: none; font-family: 'Outfit', Arial, sans-serif; font-size: 13px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; display: inline-block; border: 1px solid #1a1a1a;"
                                        >Confirm Email</a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
